<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c23"/>
      <stop offset="1" stop-color="#1c242c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- fanned card hand -->
  <g transform="translate(320,190)">
    <g transform="rotate(-16)">
      <rect x="-58" y="-92" width="116" height="164" rx="10" fill="#10151a" stroke="#3a4754" stroke-width="2"/>
      <circle cx="0" cy="-56" r="9" fill="#ff5f56"/>
    </g>
    <g transform="rotate(-5)">
      <rect x="-58" y="-92" width="116" height="164" rx="10" fill="#10151a" stroke="#3a4754" stroke-width="2"/>
      <circle cx="0" cy="-56" r="9" fill="#4f9dff"/>
    </g>
    <g transform="rotate(6)">
      <rect x="-58" y="-92" width="116" height="164" rx="10" fill="#161c23" stroke="#42c6e6" stroke-width="2.5"/>
      <circle cx="0" cy="-56" r="9" fill="#42c6e6"/>
      <path d="M-16 6h32M-16 20h20" stroke="#42c6e6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="rotate(17)">
