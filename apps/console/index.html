<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Console — Battle Simulator</title>

<!--
  The console is built on appfr (vendor/appfr, served at /appfr/ by the API
  server): its DataShell is the query header and result views, and every object
  the server knows about — games, sessions, recordings, scenarios, units, sides,
  agents, options, source files — is one entity in its schema.

  No build step, like the other apps here: the import map names appfr's built
  ES modules and a Vue 3.5 runtime (appfr needs 3.5's useId), and
  vue3-sfc-loader compiles this app's .vue files in the tab. Every path is
  relative, so the app works under a mount prefix (/battle-simulator/ui/console).
-->

<link rel="stylesheet" href="../../appfr/style.css"/>
<!-- The game screen (play/): its fonts and its look, all of it under .play. -->
<link rel="stylesheet" href="./play/vendor/fonts/fonts.css"/>
<link rel="stylesheet" href="./play/play.css"/>

<script type="importmap">
{
  "imports": {
    "vue": "./vendor/vue.runtime.esm-browser.prod.js",
    "header-content-layout": "../../appfr/index.js"
  }
}
</script>

<style>
html, body { height: 100%; margin: 0; }
body { background: #0f1216; color-scheme: dark; }
#app { height: 100vh; display: flex; flex-direction: column; }
#boot { margin: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; color: #8a96a1; }
#boot.err { color: #ff8a80; white-space: pre-wrap; padding: 24px; }
</style>

<!-- The game screen's plain scripts, which hang what they offer off window: the
     board's drawing and geometry (data.js, vision.js, …), the API client the session
     view talks through (api.js — window.api), the seating and scenario rules every
     form here starts a session by (gameDefaults.js), and the sounds. -->
<script src="./play/data.js"></script>
<script src="./play/vision.js"></script>
<script src="./play/keyBindings.js"></script>
<script src="./play/boardMoves.js"></script>
<script src="./play/groupOrders.js"></script>
<script src="./play/unitOrders.js"></script>
<script src="./play/exactNumber.js"></script>
<script src="./play/api.js"></script>
<script src="./play/teamPalette.js"></script>
<script src="./play/gameDefaults.js"></script>
<script src="./play/teamSprite.js"></script>
<script src="./play/sound.js"></script>
<script src="./play/cs-sound.js"></script>
<script src="./play/confetti.js"></script>
<script src="./play/chess-sound.js"></script>
</head>
<body>
<div id="app"><p id="boot">Loading…</p></div>

<script type="module">
import * as Vue from 'vue'
import * as appfr from 'header-content-layout'
import { loadModule } from './vendor/vue3-sfc-loader.esm.js'
import { installPlay } from './play/install.js'

const options = {
  // The shell must run on this very Vue, not a second copy fetched by the loader.
  moduleCache: { vue: Vue, 'header-content-layout': appfr },
  async getFile(url) {
    const response = await fetch(url, { cache: 'no-cache' })
    if (!response.ok) throw new Error(`${response.status} ${url}`)
    const text = await response.text()
    // This app's .js files are ES modules; the loader would parse them as
    // classic scripts unless told so.
    return { getContentData: () => text, type: url.endsWith('.js') ? '.mjs' : undefined }
  },
  addStyle(css) {
    document.head.append(Object.assign(document.createElement('style'), { textContent: css }))
  },
  // Bare specifiers go to moduleCache; everything else resolves as a URL (the
  // loader's default joins strings and folds `http://` down to `http:/`).
  pathResolve({ refPath, relPath }) {
    if (relPath === '.') return refPath
    if (!relPath.startsWith('.') && !relPath.startsWith('/')) return relPath
    return new URL(relPath, refPath ?? document.baseURI).href
  },
}

try {
  const App = await loadModule(new URL('./App.vue', document.baseURI).href, options)
  document.getElementById('app').replaceChildren()
  const app = Vue.createApp(App)
  installPlay(app)
  app.mount('#app')
} catch (error) {
  const boot = document.getElementById('boot')
  boot.className = 'err'
  boot.textContent = `The console failed to load:\n${error?.stack ?? error}`
}
</script>
</body>
</html>
